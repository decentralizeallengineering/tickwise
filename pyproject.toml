[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tickwise"
version = "0.1.0"
description = "Adaptive tick intervals for self-waking agents, stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
tickwise = "tickwise.cli:main"

[tool.setuptools]
packages = ["tickwise"]
